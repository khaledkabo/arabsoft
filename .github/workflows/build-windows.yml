name: Build ARAB SOFT for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: arabsoft_service_system/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r arabsoft_service_system/requirements.txt

      - name: Build Windows EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ARAB_SOFT_Service --icon arabsoft_service_system\ARAB_SOFT.ico launcher.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ARAB_SOFT_Service-Windows
          path: dist/ARAB_SOFT_Service.exe
          if-no-files-found: error
          retention-days: 30
